org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# BIWIN is ExFAT: macOS writes com.apple.provenance xattrs as ._ sidecars there,
# which break aapt/d8. Keep build outputs on the internal APFS volume instead.
android.buildDir=$HOME/.vpnflow-build
