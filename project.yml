name: PrivateVPN
options:
  bundleIdPrefix: com.privatevpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  WireGuardKit:
    path: Vendor/WireGuardKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G6XW3RN6LJ

targets:
  PrivateVPN:
    type: application
    platform: iOS
    sources:
      - iOS/PrivateVPN
    info:
      path: iOS/PrivateVPN/Info.plist
      properties:
        CFBundleDisplayName: PrivateVPN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Dev: allow HTTP to the VPS coordinator (public IP). Replace with HTTPS before release.
          NSAllowsArbitraryLoads: true
    entitlements:
      path: iOS/PrivateVPN/PrivateVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app
        PRODUCT_NAME: PrivateVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    dependencies:
      - target: PrivateVPNPacketTunnel
        embed: true
      - package: WireGuardKit
    scheme:
      testTargets:
        - PrivateVPNTests

  PrivateVPNPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - iOS/PrivateVPNPacketTunnel
      - path: iOS/PrivateVPN/Services/WireGuardConfig.swift
      - path: iOS/PrivateVPN/Services/ControlAPIClient.swift
    info:
      path: iOS/PrivateVPNPacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PrivateVPN Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: iOS/PrivateVPNPacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.packet-tunnel
        PRODUCT_NAME: PrivateVPNPacketTunnel
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    dependencies:
      - package: WireGuardKit

  PrivateVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iOS/PrivateVPNTests
    dependencies:
      - target: PrivateVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PrivateVPN.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PrivateVPN
        BUNDLE_LOADER: $(TEST_HOST)
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"

  PrivateVPNMac:
    type: application
    platform: macOS
    sources:
      - path: mac/PrivateVPNMac
        excludes:
          - "Resources/ChatGPT*.png"
      - path: iOS/PrivateVPN/Services/ControlAPIClient.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.mac
        PRODUCT_NAME: FPTPrivateVPN
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: mac/PrivateVPNMac/Info.plist
      properties:
        CFBundleDisplayName: FPT PrivateVPN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    postCompileScripts:
      - name: Copy AppIcon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/mac/PrivateVPNMac/Resources/AppIcon.icns" \
             "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.mac
        PRODUCT_NAME: FPTPrivateVPN
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
