name: PrivateVPN
options:
  bundleIdPrefix: com.privatevpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  WireGuardKit:
    path: Vendor/WireGuardKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G6XW3RN6LJ

targets:
  PrivateVPN:
    type: application
    platform: iOS
    sources:
      - iOS/PrivateVPN
    info:
      path: iOS/PrivateVPN/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: FlowVPN
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: iOS/PrivateVPN/PrivateVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privatevpn.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app
        PRODUCT_NAME: FlowVPN
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    dependencies:
      - target: PrivateVPNPacketTunnel
        embed: true
      - package: WireGuardKit
    scheme:
      testTargets:
        - PrivateVPNTests

  PrivateVPNPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - iOS/PrivateVPNPacketTunnel
      - path: iOS/PrivateVPN/Services/WireGuardConfig.swift
      - path: iOS/PrivateVPN/Services/ControlAPIClient.swift
      - path: iOS/PrivateVPN/Services/KeychainStore.swift
    info:
      path: iOS/PrivateVPNPacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: FlowVPN Tunnel
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: iOS/PrivateVPNPacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.privatevpn.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.packet-tunnel
        PRODUCT_NAME: PrivateVPNPacketTunnel
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    dependencies:
      - package: WireGuardKit

  PrivateVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iOS/PrivateVPNTests
    dependencies:
      - target: PrivateVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FlowVPN.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FlowVPN
        BUNDLE_LOADER: $(TEST_HOST)
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"

  PrivateVPNMac:
    type: application
    platform: macOS
    productName: FlowVPN
    sources:
      - path: mac/PrivateVPNMac
        excludes:
          - "Resources/ChatGPT*.png"
      - path: iOS/PrivateVPN/Services/ControlAPIClient.swift
      - path: iOS/PrivateVPN/Services/WireGuardConfig.swift
      - path: iOS/PrivateVPN/Services/AppVersionService.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.mac
        PRODUCT_NAME: FlowVPN
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    info:
      path: mac/PrivateVPNMac/Info.plist
      properties:
        CFBundleDisplayName: FlowVPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: "14.0"
    entitlements:
      path: mac/PrivateVPNMac/PrivateVPNMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    postCompileScripts:
      - name: Copy AppIcon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          mkdir -p "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          cp "${SRCROOT}/mac/PrivateVPNMac/Resources/AppIcon.icns" \
             "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
    dependencies:
      - target: PrivateVPNMacPacketTunnel
        embed: true
      - package: WireGuardKit
    scheme:
      testTargets: []

  PrivateVPNMacPacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: iOS/PrivateVPNPacketTunnel/PacketTunnelProvider.swift
      - path: iOS/PrivateVPN/Services/WireGuardConfig.swift
    info:
      path: mac/PrivateVPNMacPacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: FlowVPN Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: mac/PrivateVPNMacPacketTunnel/PrivateVPNMacPacketTunnel.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.mac.packet-tunnel
        PRODUCT_NAME: PrivateVPNMacPacketTunnel
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LIBRARY_SEARCH_PATHS:
          - "$(DERIVED_FILE_DIR)/wg"
    preBuildScripts:
      - name: Build wireguard-go
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="$PATH:/opt/homebrew/bin:/usr/local/bin"
          WGK="${SRCROOT}/Vendor/WireGuardKit/Sources/WireGuardKitGo"
          mkdir -p "${DERIVED_FILE_DIR}/wg" "${DERIVED_FILE_DIR}/wg-tmp"
          make -C "$WGK" \
            PLATFORM_NAME="$PLATFORM_NAME" \
            ARCHS="$ARCHS" \
            DESTDIR="${DERIVED_FILE_DIR}/wg" \
            CONFIGURATION_TEMP_DIR="${DERIVED_FILE_DIR}/wg-tmp"
    dependencies:
      - package: WireGuardKit
