name: PrivateVPN
options:
  bundleIdPrefix: com.privatevpn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic

targets:
  PrivateVPN:
    type: application
    platform: iOS
    sources:
      - iOS/PrivateVPN
    info:
      path: iOS/PrivateVPN/Info.plist
      properties:
        CFBundleDisplayName: PrivateVPN
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: iOS/PrivateVPN/PrivateVPN.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app
        PRODUCT_NAME: PrivateVPN
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: PrivateVPNPacketTunnel
        embed: true
    scheme:
      testTargets:
        - PrivateVPNTests

  PrivateVPNPacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - iOS/PrivateVPNPacketTunnel
    info:
      path: iOS/PrivateVPNPacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PrivateVPN Tunnel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: iOS/PrivateVPNPacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.packet-tunnel
        PRODUCT_NAME: PrivateVPNPacketTunnel
        SKIP_INSTALL: YES

  PrivateVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - iOS/PrivateVPNTests
    dependencies:
      - target: PrivateVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.privatevpn.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PrivateVPN.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PrivateVPN
        BUNDLE_LOADER: $(TEST_HOST)
